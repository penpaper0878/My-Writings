<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>My Writings</title>
<meta name="description" content="Poems, blogs and quotes in Gujarati, Hindi and English."/>
<meta name="theme-color" content="#15120E"/>
<meta name="color-scheme" content="light dark"/>

<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icons/icon-192.png"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>

<!-- Open Graph: what a shared link looks like in WhatsApp and elsewhere.
     app.js keeps the title and description in step with your settings. -->
<meta property="og:type" content="website"/>
<meta property="og:title" content="My Writings"/>
<meta property="og:description" content="Poems, blogs and quotes in Gujarati, Hindi and English."/>
<meta name="twitter:card" content="summary_large_image"/>

<!-- Warm up the font host before the first family is requested. -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"/>

<link rel="stylesheet" href="assets/css/app.css"/>

<style>
  /* Holds the page steady until theme.js has written the real palette, so the
     first paint is never a white flash on a dark theme. */
  #boot-splash {
    position: fixed;
    inset: 0;
    z-index: 500;
    display: grid;
    place-items: center;
    background: #15120E;
    transition: opacity .3s ease;
  }
  #boot-splash.is-done { opacity: 0; pointer-events: none; }
  #boot-splash .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: #D9A566;
    animation: bootPulse 1.1s ease-in-out infinite;
  }
  @keyframes bootPulse { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
  .no-js-note {
    max-width: 560px;
    margin: 80px auto;
    padding: 0 20px;
    font-family: system-ui, sans-serif;
    color: #E8E2D6;
    text-align: center;
    line-height: 1.7;
  }
</style>
</head>

<body>
  <div id="page-bg" aria-hidden="true"></div>

  <div id="boot-splash" aria-hidden="true"><div class="dot"></div></div>

  <noscript>
    <div class="no-js-note">
      <h1>This site needs JavaScript</h1>
      <p>The writing is stored in a single data file and assembled in your browser,
         which is what keeps the site free to run. Please turn JavaScript on.</p>
    </div>
  </noscript>

  <a href="#main" class="sr-only">Skip to content</a>

  <header id="topbar-outer" class="topbar-outer">
    <div id="topbar" class="topbar"></div>
  </header>

  <div class="shell">
    <main id="main"></main>
  </div>

  <div id="toast-host" class="toast-host" aria-live="polite"></div>

  <!-- Plain scripts, no bundler. Each file defines one global and reaches for
       the others only inside functions, so nothing runs before app.js boots. -->
  <script src="assets/js/store.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/rich.js"></script>
  <script src="assets/js/views.js"></script>
  <script src="assets/js/share.js"></script>
  <script src="assets/js/publish.js"></script>
  <script src="assets/js/editor.js"></script>
  <script src="assets/js/settings.js"></script>
  <script src="assets/js/feedback.js"></script>
  <script src="assets/js/app.js"></script>

  <script>
    // Clear the splash once the first real view is in place — or after two
    // seconds regardless, so a failed load never leaves a blank screen.
    (function () {
      var splash = document.getElementById('boot-splash');
      if (!splash) return;
      var done = false;
      function finish() {
        if (done) return;
        done = true;
        splash.classList.add('is-done');
        setTimeout(function () {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 340);
      }
      var check = setInterval(function () {
        var main = document.getElementById('main');
        if (main && main.childNodes.length) { clearInterval(check); finish(); }
      }, 60);
      setTimeout(function () { clearInterval(check); finish(); }, 2000);
    })();
  </script>
</body>
</html>
