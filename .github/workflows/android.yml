name: pdf2md Android app

# Builds the APK and tests it on an Android emulator. Download the APK from the
# run's "Artifacts" section (pdf2md-android).
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine tests (parity with the desktop tool)
        run: ./gradlew --no-daemon -p core test

      - name: Build the APK and the on-device tests
        run: ./gradlew --no-daemon :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: On-device tests (Android 14 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/core/build/reports/tests/
            android/app/build/reports/androidTests/
          retention-days: 14

      - name: Collect the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk dist/pdf2md.apk
          cp app/build/outputs/apk/release/app-x86_64-release.apk dist/pdf2md-x86_64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pdf2md-android
          path: android/dist/
          retention-days: 90
