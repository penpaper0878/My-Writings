name: android probe (temporary)
on:
  push:
    paths: [".github/workflows/android-probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Versions on Google Maven
        run: |
          gi() { curl -sSL "https://maven.google.com/$1/group-index.xml" | grep -o "<$2 versions=\"[^\"]*\"" | tr ',' '\n' | grep -viE 'alpha|beta|rc' | tail -4 | tr '\n' ' '; echo " <= $1:$2"; }
          gi com/android/tools/build gradle
          gi androidx/compose compose-bom
          gi androidx/activity activity-compose
          gi androidx/core core-ktx
          gi androidx/lifecycle lifecycle-runtime-compose
          gi com/google/mlkit text-recognition
          gi com/google/mlkit text-recognition-devanagari
          gi com/google/android/gms play-services-mlkit-document-scanner
          gi androidx/test/ext junit
          gi androidx/test runner
          gi androidx/test/espresso espresso-core
      - name: MuPDF on maven.ghostscript.com
        run: curl -sSL https://maven.ghostscript.com/com/artifex/mupdf/fitz/maven-metadata.xml | grep -o '<version>[^<]*' | tail -12 | tr '\n' ' '
      - name: Model files on Hugging Face
        run: |
          for r in Qwen/Qwen3-VL-2B-Instruct-GGUF ggml-org/Qwen3-VL-2B-Instruct-GGUF Qwen/Qwen3-VL-4B-Instruct-GGUF ggml-org/Qwen3-VL-4B-Instruct-GGUF ggml-org/SmolVLM-256M-Instruct-GGUF; do
            echo "== $r"
            curl -sS "https://huggingface.co/api/models/$r/tree/main" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d if isinstance(d,dict) else '\n'.join(f'{x[\"path\"]} {x.get(\"size\",0)//1048576} MB' for x in d))"
          done
      - name: Runner Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"; ls $ANDROID_HOME/platforms $ANDROID_HOME/build-tools $ANDROID_HOME/ndk 2>&1 | tr '\n' ' '; echo
          ls -l /dev/kvm; java -version 2>&1 | head -1; nproc; free -g | head -2
